<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Quiz App</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="https://play-lh.googleusercontent.com/F7JLJrVz0UGwtONcKM1kFKxYo-bBxU0HIJNtItx0FFsHCCMWkk48YCrEp5rWpGcHgCQL6BfaORphgd6-SNeyIw">
</head>
<style>
    .quiz-home {
        background: linear-gradient(130deg, #463dcd, #9f5cbc);
    }

    
    #display-question {
        width: 100%;
        min-height: 60px;
        display: flex;
        align-items: center;
    }

    
    #display-option {
        width: 100%; 
    }

   
    .option-box {
        width: 100%;
        min-height: 45px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
    }

    .quiz-card {
        width: 700px;
        max-width: 90%;
    }

    .play-btn {
        background: linear-gradient(130deg, #463dcd, #9f5cbc);
        color: #fff !important;

    }

    .play-btn:hover {
        background: linear-gradient(130deg, #625bcb, #a070b4);
        color: #fff;
        border: 0;
        transition: all 0.3 ease;
    }


    .quiz-home hr {
        background: linear-gradient(90deg, #7414d8, #087fff);
        width: 130px;
    }

    #quiz-screen {
        background: linear-gradient(130deg, #463dcd, #9f5cbc);
        color: #fff;
    }

    .option-box {
        display: block;
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        background-color: #ededed;
        border-radius: 25px;
        cursor: pointer;
    }

    .time-box {
        background: #fff;
        color: #000;
        padding: 8px 15px;
        border-radius: 20px;
        font-weight: 600;
    }

    .answer-corect {
        background: #d1e7dd;
        border-left: 5px solid #198754;
        padding: 15px;
        border-radius: 10px;
    }

    .answer-wrong {
        background: #f8d7da;
        border-left: 5px solid #dc3545;
        padding: 15px;
        border-radius: 10px;
    }

    .answer-unanswered {
        background: #fff3cd;
        border-left: 5px solid #ffc107;
        padding: 15px;
        border-radius: 10px;
    }
</style>

<body>

    <!-- ================= HOME SCREEN ================= -->

    <div id="home-screen" class="vh-100 d-flex text-center justify-content-center align-items-center">

        <div class="quiz-home shadow position-absolute top-50 start-50 translate-middle p-5 rounded-4">

            <div class="display-5">🧠</div>

            <h1 class="display-4 fw-medium text-light">Quiz App</h1>
            <hr class="position-absolute start-50 translate-middle m-0">
            <hr class="position-absolute start-50 translate-middle m-0">
            <hr class="position-absolute start-50 translate-middle m-0">
            <hr class="position-absolute start-50 translate-middle m-0">

            <br><br>


            <p class="text-light">Test your knowledge with this app!</p>

            <button class="btn play-btn ps-5 pe-5 text-light fs-5" onclick="startQuiz()">START</button>
            <br><br><br><br>

        </div>

    </div>


    <!-- ================= QUIZ SCREEN ================= -->

    <div id="quiz-screen" class="vh-100  d-none">

        <div class="quiz-card text-bg-light position-absolute top-50 start-50 translate-middle p-4 rounded-4">

            <!-- time and submit button -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="time-box">
                    Time: <span id="time">01:00</span>
                </div>

                <button class="btn play-btn px-4" onclick="submitQuiz()">Submit</button>
            </div>

            <!-- Question and Option box -->

            <h4 id="display-question"></h4><br>

            <ul class="list-unstyled" id="display-option">
            </ul>

            <div class="d-flex justify-content-between" style="margin-top: 2rem;">

                <button id="prev-btn" class="btn play-btn ps-5 pe-5 fs-6" onclick="prevQuestion()">
                    Prev
                </button>

                <button id="next-btn" class="btn play-btn ps-5 pe-5 fs-6 " onclick="nextQuestion()">
                    Next
                </button>

            </div>

        </div>

    </div>

    <!-- ================= RESULT SCREEN ================= -->

    <div id="result-screen" class="min-vh-100 bg-light d-none py-5">
        <div class="container">
            <div class="card shadowp p-4 mx-auto" style="max-width: 800px;">
                <h2 class="text-center mb-3">Quiz Result</h2>
                <h3 id="score" class="text-center mb-4"></h3>
                <hr>
                <h4 class="mb-3">Answer Sheet</h4>

                <div id="answer-sheet"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your JavaScript -->
    <script src="./script.js"></script>

</body>

</html>
